<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Not Found</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
        color: #000;
        background: #fff;
      }
      main {
        max-width: 64rem;
        margin: 0 auto;
        padding: 2.5rem 1.5rem;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 500;
        margin: 0;
      }
      pre {
        margin-top: 1.5rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", "Courier New", monospace;
        font-size: 0.875rem;
        line-height: 1.25rem;
        white-space: pre;
      }
      .hint {
        margin-top: 1.5rem;
        font-size: 0.875rem;
        line-height: 1.25rem;
        opacity: 0.55;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Not Found</h1>
      <pre>
        /ᐠ  > ˕ < マ
      </pre>
      <div class="hint">Redirecting…</div>
    </main>

    <script>
      // GitHub Pages SPA fallback:
      // store the requested URL, then send the browser to `/` where the SPA
      // will restore it (see `src/main.tsx`).
      (function () {
        try {
          var redirect =
            window.location.pathname +
            window.location.search +
            window.location.hash;
          window.sessionStorage.setItem("spa:redirect", redirect);
        } catch (e) {}
        window.location.replace("/");
      })();
    </script>
  </body>
</html>
